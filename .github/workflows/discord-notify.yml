name: Notify Discord

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success", "failure", "cancelled"]'), github.event.workflow_run.conclusion)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read published version
        id: version
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git show "$SOURCE_SHA:VERSION" 2>/dev/null || true)
          printf "value=%s\n" "$version" >> "$GITHUB_OUTPUT"

      - name: Send Discord result
        uses: ./.github/actions/discord-result
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          token: ${{ secrets.GITHUB_TOKEN }}
          project: Discord Cleanup
          event: Build
          result: ${{ github.event.workflow_run.conclusion }}
          sha: ${{ github.event.workflow_run.head_sha }}
          version: ${{ steps.version.outputs.value }}
          run-id: ${{ github.event.workflow_run.id }}
          run-attempt: ${{ github.event.workflow_run.run_attempt }}
