name: Prepare Release Branch

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare release commit
        env:
          BUMP_TYPE_INPUT: ${{ inputs.bump_type }}
        id: prepare
        run: |
          set -euo pipefail

          git fetch origin main --prune --tags

          bump_type="${BUMP_TYPE_INPUT:-}"
          current_version=$(git show origin/main:VERSION)
          major=$(echo "$current_version" | cut -d. -f1)
          minor=$(echo "$current_version" | cut -d. -f2)
          patch=$(echo "$current_version" | cut -d. -f3)

          case "$bump_type" in
            major)
              new_version="$((major + 1)).0.0"
              ;;
            minor)
              new_version="$major.$((minor + 1)).0"
              ;;
            patch)
              new_version="$major.$minor.$((patch + 1))"
              ;;
            *)
              echo "Unknown bump type: $bump_type"
              exit 1
              ;;
          esac

          branch="release/${new_version}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists."
            exit 1
          fi

          git switch -c "$branch" origin/main

          python scripts/changelog.py prepare "$new_version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "Prepare release v${new_version}"
          git push -u origin "$branch"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$new_version" >> "$GITHUB_OUTPUT"

          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}"
          {
            echo "## Release branch ready"
            echo
            echo "- Branch: \`${branch}\`"
            echo "- Version: \`${new_version}\`"
            echo "- [Create the release pull request](${compare_url})"
          } >> "$GITHUB_STEP_SUMMARY"
